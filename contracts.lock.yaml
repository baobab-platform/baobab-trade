# The baobab-platform/shared contracts baobab-trade implements or consumes
# (EA Plan v2.0 EA-01A; schema: shared .baobab/contract-consumer-lock.schema.json).
# Foundation checks that the commit is on Shared main and that every listed
# contract exists and parses there, and reports drift in the job summary.
# Migrated from the legacy nabhold-contract-consumption-lock pinned at
# nabhold/shared@2da1a42. Re-pinned to baobab-platform/shared main after the
# EA-01 compatibility sequence (ADR-SHARED-018 T-COMPAT-04..07): mapping
# resolution redeems a stored context (ADR-SHARED-014), and the conformance
# suite (tests/shared-conformance, `npm run test:shared-conformance`) validates
# Trade against these exact files at this commit.
schema: baobab-contract-consumer-lock
version: "1.0"
source:
  repository: baobab-platform/shared
  commit: 742295e2b4f67a3de6d985e7da6bd89ed0be39cb
contracts:
  - contracts/commerce/v1/seller-binding.schema.json
  - contracts/payments/v1/merchant-readiness.schema.json
  - contracts/authorization/v1/scope-registry.yaml
  # P0-04A: exact consequential wire contracts; closure is generated from this pin.
  - contracts/organisation/v1/domain.schema.json
  - contracts/organisation/v1/iam.schema.json
  - contracts/organisation/v2/domain.schema.json
  - contracts/organisation/v2/legal-actor-enforcement.schema.json
  - contracts/organisation/v2/legal-actor-mandate.schema.json
  - contracts/admission/v2/documentary-restriction.schema.json
  - contracts/control-plane/v1/canonical-mapping.schema.json
  # $ref target of the context_id grammar used by mapping resolution.
  - contracts/control-plane/v1/capability-explanation.schema.json
  - contracts/control-plane/v1/context-resolution.schema.json
  - contracts/control-plane/v1/domain.schema.json
  # Registered (system_namespace, engine_id) pairs a mapping target must use,
  # e.g. medusa / baobab-trade.
  - contracts/control-plane/v1/external-systems.yaml
  # Market registry schema is published, but no Market instance exists yet for
  # ZuriBeans UG or ZA: legal-entity/registry.yaml records ZURIBEANS with
  # markets: []. Trade MUST resolve real market_id values from Control Plane
  # (GET /v1/markets/{market_id}) once activated, not mint them locally.
  - contracts/control-plane/v1/market.schema.json
  - contracts/control-plane/v1/openapi.yaml
  # Stored platform context: its context_id is what mapping resolution redeems.
  - contracts/control-plane/v1/platform-context.schema.json
  - contracts/development-environment/schema.yaml
  - contracts/errors/v1/problem-details.schema.json
  - contracts/events/v1/context-registry.yaml
  - contracts/events/v1/envelope.schema.json
  # ADR-SHARED-018: every event type Trade publishes is registered here.
  - contracts/events/v1/event-registry.yaml
  - contracts/idempotency/v1/policy.yaml
  # Scopes the baobab-trade-workload identity is allowed; the conformance suite
  # checks the Control Plane operations Trade calls against it.
  - contracts/identity/v1/workload-registry.yaml
  # ZB-G03 step 3 (ADR-0033): the IAM buyer token Trade verifies and CP's
  # delegated Principal resolution Trade calls.
  - contracts/identity/v1/buyer-identity-handoff.schema.json
  - contracts/identity/v1/principal-resolution.schema.json
  - contracts/identity/v1/principal-resolution.openapi.yaml
  # ADR-SHARED-042 CAA-03/04/05 (ADR-0033): the BFF caller credential and
  # buyer assurance policy, CP's estate client binding attestation, and the
  # TradeBuyerExecutionContext Trade returns.
  - contracts/identity/v1/assurance-policy.schema.json
  - contracts/control-plane/v1/estate-client-binding.schema.json
  - contracts/control-plane/v1/estate-client-binding.openapi.yaml
  - contracts/trade/v2/buyer-execution-context.schema.json
  - contracts/trade/v2/buyer-spend-budget.schema.json
  # ADR-SHARED-042 section 14 Decisions 6-8 (ADR-0034): the buyer-authority
  # receipt and commitment valuation the B2B fence consumes, CP's estate
  # commerce profile attestation, and the NativeCommitmentClassification
  # Trade records from it.
  - contracts/trade/v2/buyer-authority-receipt.schema.json
  - contracts/trade/v2/buyer-commitment-valuation.schema.json
  - contracts/control-plane/v1/estate-commerce-profile.schema.json
  - contracts/control-plane/v1/estate-commerce-profile.openapi.yaml
  - contracts/trade/v2/native-commitment-classification.schema.json
  - contracts/buyer-organisation/v1/domain.schema.json
  - contracts/legal-entity/registry.yaml
  - contracts/tenancy/tenancy.yaml
  # ADR-SHARED-039 Trade-0: Trade attests its native seller configuration to
  # the CP-owned Seller Operating Binding registry; Trade-A resolves order
  # authority against the closed catalogue.
  - contracts/trade/v2/seller-operating-binding.schema.json
  - contracts/trade/v2/order-authority.schema.json
  - contracts/trade/v2/order-operations.yaml
policy:
  updates: explicit_pull_request
  compatibility: validate_before_merge
# Repository-specific metadata, carried over from the legacy lock.
consumer:
  repository: baobab-platform/baobab-trade
  version: "0.2.0"
consumer_policy:
  fail_on_unresolved_tenant_context: true
  allow_cross_engine_database_access: false
  allow_local_redefinition_as_canonical: false
control_plane:
  repository: baobab-platform/baobab-cp
  role: "authoritative runtime provider of authenticated tenant context, market registry and product entitlement"
  context_resolution_endpoint: "POST /v1/context/resolve"
  market_endpoint: "GET /v1/markets/{market_id}"
  mapping_resolution_endpoint: "POST /v1/resolution/mappings"
