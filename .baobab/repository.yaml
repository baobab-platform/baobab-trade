schema_version: 1
repository:
  lifecycle: active
capabilities:
  - node
  - container
  - engine
environment:
  baobab_dev:
    required: true
    profile: full
package_managers:
  node: npm
artifacts:
  container:
    enabled: true
    dockerfile: Dockerfile
    context: .
    runtime: true
security:
  sast_provider: fallback
