schema_version: 1
repository:
  lifecycle: active
capabilities:
  - node
  - container
  - engine
environment:
  baobab_dev:
    required: true
    profile: full
package_managers:
  node: npm
artifacts:
  container:
    enabled: true
    dockerfile: Dockerfile
    context: .
    runtime: true
security:
  sast_provider: fallback
exceptions:
  dependency-audit:
    reason: "Unfixed upstream npm advisories (braces, @graphql-tools/utils 10.x via Medusa) block the audit gates; remediate by Medusa upgrade"
    expires: "2026-11-09"
    approved_by: "@bjnabs"
  container-scan:
    reason: "Image scan inherits the same unfixed upstream advisories from the Medusa dependency tree; remove with the Medusa upgrade"
    expires: "2026-11-09"
    approved_by: "@bjnabs"
