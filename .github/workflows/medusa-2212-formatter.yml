name: Format DEV-11 candidate source (temporary)
on:
  pull_request:
    paths:
      - src/**
      - tests/event-outbox.test.ts
      - docs/architecture/dev11-real-rabbitmq-otel-qualification.md
      - .github/workflows/medusa-2212-formatter.yml

permissions:
  contents: write

jobs:
  prettier:
    if: >-
      github.event.pull_request.head.repo.full_name == 'baobab-platform/baobab-trade' &&
      github.event.pull_request.head.ref == 'feat/dev11-native-otel-outbox-20261102'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Canonically format only the six confirmed DEV-11 source files
        run: |
          npx prettier --write -- \
            docs/architecture/dev11-real-rabbitmq-otel-qualification.md \
            src/baobab/events/outbox-record-adapter.ts \
            src/baobab/events/outbox.ts \
            src/baobab/observability/http-middleware.ts \
            src/scripts/qualify-dev11-native-outbox.ts \
            tests/event-outbox.test.ts
      - name: Commit only reviewed formatting changes to the same candidate head
        run: |
          set -euo pipefail
          git diff --check
          files=(
            docs/architecture/dev11-real-rabbitmq-otel-qualification.md
            src/baobab/events/outbox-record-adapter.ts
            src/baobab/events/outbox.ts
            src/baobab/observability/http-middleware.ts
            src/scripts/qualify-dev11-native-outbox.ts
            tests/event-outbox.test.ts
          )
          if git diff --quiet -- "${files[@]}"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${files[@]}"
          git commit -m 'style(DEV-11): preserve Prettier baseline for native Trade observability'
          git push origin HEAD:refs/heads/feat/dev11-native-otel-outbox-20261102
