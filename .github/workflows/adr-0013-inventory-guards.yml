name: ADR-0013 Inventory Development Conformance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inventory-boundaries:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Inventory and reconciliation regressions
        run: npx vitest run tests/inventory-availability.test.ts tests/inventory-reconciliation.test.ts tests/adr-0013-inventory-guard.test.ts
      - name: Changed-file formatting
        run: npx prettier --check src/baobab/inventory/availability-port.ts src/baobab/inventory/reconciliation.ts tests/adr-0013-inventory-guard.test.ts docs/development/ADR-0013-2026-11-09-implementation-audit.md

