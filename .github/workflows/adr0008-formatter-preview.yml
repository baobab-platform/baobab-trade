name: ADR-0008 formatter diff (temporary)

on:
  pull_request:

permissions:
  contents: read

jobs:
  formatter:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Show exact ADR-0008 formatting corrections
        run: |
          npx prettier --write src/baobab/config/startup-validation.ts tests/adr-0008-startup-validation.test.ts docs/operations/adr-0008-runtime-configuration.md
          git diff --no-ext-diff -- src/baobab/config/startup-validation.ts tests/adr-0008-startup-validation.test.ts docs/operations/adr-0008-runtime-configuration.md
