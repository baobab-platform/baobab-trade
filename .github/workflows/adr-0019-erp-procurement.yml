name: ADR-0019 ERP Procurement Evidence Development
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  po-adoption:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/adr-0019-erp-po-adoption.test.ts
      - run: npx prettier --check src/baobab/procurement/erp-po-adoption.ts tests/adr-0019-erp-po-adoption.test.ts docs/development/ADR-0019-2026-11-09-implementation-audit.md
