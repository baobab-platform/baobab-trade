name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Daily full npm lockfile advisory audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact Trade source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use repository-owned Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Materialize the exact locked dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fail closed on any HIGH or CRITICAL advisory or scanner error
        run: npm audit --audit-level=high
  b2b-threat-model:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run threat-model and PII/abuse-control tests
        run: npm run test:security

  codeql:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: baobab-platform/shared/.github/workflows/security-codeql.yml@c80687538bf4e77a9e41e4abb8b7223fdaece757 # shared main, verified 2026-08-30
    with:
      languages: '["javascript-typescript"]'
