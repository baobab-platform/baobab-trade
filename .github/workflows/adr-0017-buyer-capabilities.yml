name: ADR-0017 Buyer Capabilities Development Conformance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  explicit-org:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/adr-0017-buyer-capability-selection.test.ts tests/b2b-threat-model.test.ts
      - run: npx prettier --check src/baobab/b2b/capability-selection.ts src/api/store/b2b/capabilities/route.ts tests/adr-0017-buyer-capability-selection.test.ts docs/development/ADR-0017-2026-11-09-implementation-audit.md
