name: Release Readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install reproducible dependencies
        run: npm ci
      - name: Run production conformance tests
        run: npm run test:conformance
      - name: Build release candidate
        run: npm run build
      - name: Generate release manifest
        run: npm run release:manifest
      - name: Build immutable release image
        run: docker build --tag "baobab-trade:${{ github.sha }}" .
      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.sha }}
          path: release-manifest.json
          retention-days: 15
