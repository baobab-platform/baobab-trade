# DEV10-R3 cross-major compatibility experiment. Do not change checked-in
# Node24/npm10 production pins or infer real provider acceptance from CI.
name: DEV10 R3 Node26 Medusa compatibility
on:
  pull_request:
    paths: [.github/workflows/dev10-r3-node26.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  medusa-native:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: baobab_trade_dev10
          POSTGRES_USER: baobab_trade
          POSTGRES_PASSWORD: local-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U baobab_trade -d baobab_trade_dev10"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://baobab_trade:local-only@localhost:5432/baobab_trade_dev10
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          cache: npm
      - name: Create ephemeral unlogged test keys
        shell: bash
        run: |
          set -euo pipefail
          for name in JWT_SECRET COOKIE_SECRET BAOBAB_WEBHOOK_SIGNING_SECRET; do
            printf '%s=%s\n' "$name" "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          done
      - name: Explicit candidate Node26/npm12 with immutable npm lock
        run: |
          set -euo pipefail
          test "$(node --version)" = v26.13.0
          npm install -g npm@12.2.1
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync("package.json"));p.engines.node=">=26.13.0 <27";p.packageManager="npm@12.2.1";fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm test
          npm run test:contract
          npm run test:isolation
          npm run test:security
      - name: Native Medusa migration, build and critical denial tests
        env:
          BAOBAB_BINDING_LIFECYCLE_TEST_DB: baobab_trade_dev10
          BAOBAB_NATIVE_COMMITMENT_TEST_DB: baobab_trade_dev10
        run: |
          set -euo pipefail
          npm run migrate
          npm run migrate:search
          npm run regression:governed-binding-lifecycle
          npm run regression:native-commitment-classification
          npm run build
