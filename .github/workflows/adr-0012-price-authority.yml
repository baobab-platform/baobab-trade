name: ADR-0012 Pricing Development Conformance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  price-authority:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Pricing and scoped-candidate regressions
        run: npx vitest run tests/pricing-decision.test.ts tests/adr-0012-price-authority.test.ts
      - name: Changed-source formatting
        run: npx prettier --write src/baobab/pricing/decision-port.ts tests/pricing-decision.test.ts tests/adr-0012-price-authority.test.ts docs/development/ADR-0012-2026-11-09-implementation-audit.md

      - name: Emit exact Prettier result for source-only evidence
        run: |
          node - <<'NODE'
          const fs = require("node:fs")
          for (const path of ["src/baobab/pricing/decision-port.ts","tests/pricing-decision.test.ts","tests/adr-0012-price-authority.test.ts","docs/development/ADR-0012-2026-11-09-implementation-audit.md"]) console.log("ADR0012_FMT=" + JSON.stringify({path,content:fs.readFileSync(path, "utf8")}))
          NODE
