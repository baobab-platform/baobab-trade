# BA-SEC-DEP-001 source-conformance gate.
# Shared PR #429 merged on 2026-11-08. Trade opts into the strict validator
# after adding repository-specific manifest and exception regression tests.
# Source conformance does not prove live Dependabot alerts or security updates.
name: Enforce Dependency Maintenance Policy

on:
  push:
    branches: [main]
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/enforce-dependabot-config.yml"
      - ".github/workflows/security.yml"
      - ".github/workflows/foundation.yml"
      - ".baobab/repository.yaml"
      - "docs/security/**"
      - "tests/unit/test_dependency_maintenance.py"
  pull_request:
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/enforce-dependabot-config.yml"
      - ".github/workflows/security.yml"
      - ".github/workflows/foundation.yml"
      - ".baobab/repository.yaml"
      - "docs/security/**"
      - "tests/unit/test_dependency_maintenance.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    permissions:
      contents: read
    uses: baobab-platform/shared/.github/workflows/enforce-dependabot-config.yml@5664b1669736ddc0807709c9d2a1646325c4309a # Shared main, verified 2026-11-27
    with:
      required-ecosystems: "github-actions,npm,docker,docker-compose"
      policy-level: "strict"

  policy-regression:
    name: Manifest coverage and BA-SEC-DEP-001 negative cases
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout requested PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned offline test parser in disposable virtualenv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/baobab-dep-policy"
          "$RUNNER_TEMP/baobab-dep-policy/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Verify policy manifest paths, major separation and exception boundaries
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/baobab-dep-policy/bin/python" -B -m unittest discover -s tests/unit -p 'test_dependency_maintenance.py' -v
