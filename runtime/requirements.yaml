schema:
  name: "baobab-engine-runtime-requirements"
  version: "1.0"
application:
  name: "baobab-trade"
  kind: "commerce-engine"
  container_port: 9000
ownership:
  application_runtime: "nabhold/baobab-trade"
  production_infrastructure: "nabhold/infrastructure"
  control_plane: "nabhold/baobab-cp"
dependencies:
  postgresql:
    required: true
    minimum_major: 17
    purpose: "Medusa operational data"
  redis:
    required: true
    minimum_major: 7
    purpose: "Medusa cache, coordination and background processing"
  object_storage:
    required: true
    production_provider: "s3-compatible"
    purpose: "Commerce-owned product images and specification files"
  notifications:
    required: true
    production_provider: "sendgrid"
    purpose: "Transactional B2B email"
  control_plane:
    required: true
    purpose: "Authenticated tenant context, lifecycle and product entitlement"
health:
  liveness_path: "/health"
  readiness_path: "/readiness"
secrets:
  - "DATABASE_URL"
  - "REDIS_URL"
  - "JWT_SECRET"
  - "COOKIE_SECRET"
  - "BAOBAB_CONTROL_PLANE_BASE_URL"
  - "BAOBAB_CONTROL_PLANE_CONTEXT_PATH"
  - "BAOBAB_WEBHOOK_SIGNING_SECRET"
  - "S3_FILE_URL"
  - "S3_REGION"
  - "S3_BUCKET"
  - "S3_ACCESS_KEY_ID"
  - "S3_SECRET_ACCESS_KEY"
  - "SENDGRID_API_KEY"
  - "SENDGRID_FROM"
constraints:
  - "Do not share databases with Baobab ERP, Pulse or the Control Plane."
  - "Do not encode cloud accounts, networks, domains or production credentials in this repository."
  - "Production topology and secret injection are implemented by nabhold/infrastructure."
